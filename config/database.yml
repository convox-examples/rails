default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  
development:
  <<: *default
  database: rails_app_development
  username: rails
  password: rails
  host: localhost

test:
  <<: *default
  database: rails_app_test
  username: rails
  password: rails
  host: localhost

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Additional production-specific settings
  prepared_statements: true
  connect_timeout: 10
  checkout_timeout: 5
  reaping_frequency: 10
  idle_timeout: 300